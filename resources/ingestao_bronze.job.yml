# Job de Ingestão da Camada Bronze
# Executa em 2 etapas:
# 1. API pública de feriados (01_ingestao_api_gabarito)
# 2. Data Lake via S3/boto3 (02_ingestao_boto3_gabarito) -> extrai e carrega as 9 tabelas da bronze

resources:
  jobs:
    vertice_ingestao_bronze:
      name: vertice_ingestao_bronze
      description: Ingestão da camada Bronze da Vértice Tecnologia (API BrasilAPI + Data Lake S3/Supabase)

      # Sem agendamento automático por enquanto (execução sob demanda)

      tasks:
        # 1. API pública de feriados
        - task_key: api
          notebook_task:
            notebook_path: /Users/${workspace.current_user.userName}/ImersaoControlTower/01_ingestao_api_gabarito

        # 2. Data Lake via boto3 e carga das 9 tabelas da bronze
        - task_key: data_lake
          depends_on:
            - task_key: api
          notebook_task:
            notebook_path: /Users/${workspace.current_user.userName}/ImersaoControlTower/02_ingestao_boto3_gabarito
            base_parameters:
              # Só o que NÃO é segredo. As chaves do Supabase ficam no secret scope
              # "vertice" (aws_access_key_id / aws_secret_access_key) e o notebook
              # busca lá: nada de credencial no YAML do job.
              S3_ENDPOINT: "https://lpsmdtcpedhaxchkbuiw.storage.supabase.co/storage/v1/s3"
              AWS_DEFAULT_REGION: "us-west-2"
