# Job de Ingestão da Camada Bronze
#
# Executa a ingestão em 2 etapas:
# 1. API pública de feriados (../src/ingestao/01_ingestao_api.py)
# 2. Data Lake via S3/boto3 (../src/ingestao/02_ingestao_boto3.py) -> extrai e carrega as 9 tabelas da bronze

resources:
  jobs:
    vertice_ingestao_bronze:
      name: vertice_ingestao_bronze
      description: Ingestão da camada Bronze da Vértice Tecnologia (API BrasilAPI + Data Lake S3/Supabase)

      tasks:
        # 1. API pública de feriados
        - task_key: api
          notebook_task:
            notebook_path: ../src/ingestao/01_ingestao_api.py

        # 2. Data Lake via boto3 e carga das 9 tabelas da bronze
        - task_key: data_lake
          depends_on:
            - task_key: api
          notebook_task:
            notebook_path: ../src/ingestao/02_ingestao_boto3.py
            base_parameters:
              S3_ENDPOINT: "https://lpsmdtcpedhaxchkbuiw.storage.supabase.co/storage/v1/s3"
              AWS_DEFAULT_REGION: "us-west-2"
              AWS_ACCESS_KEY_ID: "6c5c711672b1102f4229ec0f09a5aa3d"
              AWS_SECRET_ACCESS_KEY: "f72935daa01628a8eb7054d07818d789d61789458b1fb858ea917bbc34bb8bfd"
