# Pipeline Principal Farol (Torre de Controle) - Orquestrador Geral (Nível 1)
#
# Orquestra a esteira completa da Vértice Tecnologia em sequência estrita (sem concorrência):
#   1. Camada Bronze (Job vertice_camada_bronze -> API -> Data Lake -> Validação)
#   2. Camada Silver (Pipeline DLT independente vertice_camada_silver)
#   3. Camada Gold (Pipeline DLT independente vertice_camada_gold)
#   4. Status com IA (SQL Task status_estruturado.sql no SQL Warehouse)
#   5. Testes de Qualidade (SQL Task testes.sql no SQL Warehouse)
#   6. Métricas Governadas (SQL Task metricas.sql no SQL Warehouse)
#
# Cada etapa roda apenas após o término com sucesso da anterior,
# garantindo o uso de no máximo 1 máquina por vez (compatível com cota Free Tier).

resources:
  jobs:
    vertice_farol:
      name: vertice_farol
      description: Pipeline Farol da Vértice Tecnologia - Orquestração sequencial sem concorrência (Bronze -> Silver -> Gold -> IA -> Testes -> Métricas)

      tasks:
        # Etapa 1: Ingestão e Validação da Bronze
        - task_key: camada_bronze
          run_job_task:
            job_id: ${resources.jobs.vertice_camada_bronze.id}

        # Etapa 2: Pipeline da Camada Silver
        - task_key: camada_silver
          depends_on:
            - task_key: camada_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.vertice_camada_silver.id}

        # Etapa 3: Pipeline da Camada Gold
        - task_key: camada_gold
          depends_on:
            - task_key: camada_silver
          pipeline_task:
            pipeline_id: ${resources.pipelines.vertice_camada_gold.id}

        # Etapa 4: Extração Estruturada com IA
        - task_key: status_com_ia
          depends_on:
            - task_key: camada_gold
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/ia/status_estruturado.sql

        # Etapa 5: Testes de Qualidade
        - task_key: testes_de_qualidade
          depends_on:
            - task_key: status_com_ia
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/testes/testes.sql

        # Etapa 6: Métricas Governadas (Metric View mv_projetos)
        - task_key: metricas_governadas
          depends_on:
            - task_key: testes_de_qualidade
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/metricas/metricas.sql