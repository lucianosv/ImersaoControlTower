# Pipeline Principal Farol (Torre de Controle)
#
# Orquestra os jobs modulares da Vértice Tecnologia na sequência da esteira:
#   1. Ingestão Bronze (API + Data Lake S3)
#   2. Validação Bronze (Conferência das 9 tabelas)
#   3. (Próximas entregas): Silver, Gold, IA, Métricas

resources:
  jobs:
    vertice_farol:
      name: vertice_farol
      description: Pipeline Farol da Vértice Tecnologia - Orquestração completa de Ingestão, Validação e Camadas

      # Sem agendamento automático por enquanto (execução sob demanda)

      tasks:
        # Etapa 1: Dispara o Job de Ingestão da Bronze
        - task_key: ingestao_bronze
          run_job_task:
            job_id: ${resources.jobs.vertice_ingestao_bronze.id}

        # Etapa 2: Dispara o Job de Validação da Bronze (após o término da ingestão)
        - task_key: validacao_bronze
          depends_on:
            - task_key: ingestao_bronze
          run_job_task:
            job_id: ${resources.jobs.vertice_validacao_bronze.id}