# Pipeline Principal Farol (Torre de Controle) - Orquestrador Geral (Nível 1)
#
# Orquestra a esteira completa da Vértice Tecnologia em sequência estrita (sem concorrência):
#   1. Camada Bronze (Job vertice_camada_bronze -> API -> Data Lake -> Validação)
#   2. Medalhão Silver + Gold (Pipeline DLT vertice_medalhao em 1 única máquina DLT)
#   3. Testes de Qualidade (SQL Task testes.sql no SQL Warehouse)

resources:
  jobs:
    vertice_farol:
      name: vertice_farol
      description: Pipeline Farol da Vértice Tecnologia - Orquestração sequencial sem concorrência (Bronze -> Medalhão -> Testes)

      tasks:
        # Etapa 1: Ingestão e Validação da Bronze (sequencial)
        - task_key: camada_bronze
          run_job_task:
            job_id: ${resources.jobs.vertice_camada_bronze.id}

        # Etapa 2: Medalhão Declarativo (só inicia quando a Bronze estiver 100% pronta)
        - task_key: medalhao
          depends_on:
            - task_key: camada_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.vertice_medalhao.id}

        # Etapa 3: Testes de Qualidade (só inicia quando o Medalhão terminar)
        - task_key: testes_de_qualidade
          depends_on:
            - task_key: medalhao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/testes/testes.sql