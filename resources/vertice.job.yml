# Pipeline Principal Farol (Torre de Controle)
#
# Orquestra a esteira completa da Vértice Tecnologia na sequência:
#   1. Ingestão Bronze (API + Data Lake S3)
#   2. Validação Bronze (Conferência das 9 tabelas)
#   3. Medalhão (Pipeline declarativo Lakeflow da Silver e Gold)
#   4. (Próximas entregas): IA nos textos, Métricas governadas

resources:
  jobs:
    vertice_farol:
      name: vertice_farol
      description: Pipeline Farol da Vértice Tecnologia - Orquestração completa de Ingestão, Validação e Medalhão

      tasks:
        # Etapa 1: Ingestão da Bronze
        - task_key: ingestao_bronze
          run_job_task:
            job_id: ${resources.jobs.vertice_ingestao_bronze.id}

        # Etapa 2: Validação da Bronze
        - task_key: validacao_bronze
          depends_on:
            - task_key: ingestao_bronze
          run_job_task:
            job_id: ${resources.jobs.vertice_validacao_bronze.id}

        # Etapa 3: Medalhão (Camada Silver com integração das 3 ferramentas)
        - task_key: medalhao
          depends_on:
            - task_key: validacao_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.vertice_medalhao.id}