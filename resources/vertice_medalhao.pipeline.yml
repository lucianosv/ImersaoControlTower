# Pipeline Declarativo do Medalhão (Lakeflow Spark Declarative Pipelines)
#
# Processa as camadas Silver e Gold da Vértice Tecnologia em sequência:
#   - Silver: unificação das 3 ferramentas em silver.tarefas, custos, pessoas e fornecedores
#   - Gold: fatos históricos (fato_projeto_semana), fotografia (projeto_situacao_atual) e alocação (utilizacao_pessoa_semana)
#
# Executa em um ÚNICO cluster serverless para não gerar concorrência nem estourar a cota gratuita.
# O motor do Lakeflow resolve o grafo de dependências e roda Silver -> Gold automaticamente.

resources:
  pipelines:
    vertice_medalhao:
      name: vertice_medalhao
      catalog: ${var.catalog}
      schema: silver
      serverless: true
      photon: true
      channel: CURRENT
      libraries:
        - glob:
            include: ../src/silver/**
        - glob:
            include: ../src/gold/**
