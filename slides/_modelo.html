<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[[TITULO]]</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

  :root {
    --bg: #14141A; --card: #1E1E24; --card-2: #25252d; --line: #2f2f39;
    --blue: #0059DB; --blue-2: #467CF6; --cyan: #22C2F4; --cyan-2: #62CFFC;
    --light: #F5F6FC; --gray: #6E7180; --muted: #a3a6b4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0c0c10; overflow: hidden; }
  body { font-family: "Poppins", system-ui, sans-serif; color: var(--light); }

  #viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { width: 1920px; height: 1080px; position: relative; transform-origin: center center; flex: none; }

  .slide { position: absolute; inset: 0; background: var(--bg); padding: 90px 120px 110px; display: none; flex-direction: column; overflow: hidden; }
  .slide.active { display: flex; }
  .slide::before { content: ""; position: absolute; width: 1100px; height: 1100px; right: -420px; top: -520px;
    background: radial-gradient(circle, rgba(0,89,219,.28) 0%, rgba(0,89,219,0) 65%); pointer-events: none; }
  .slide.hero { background: radial-gradient(ellipse at 80% 20%, #0b3a8f 0%, #14141A 55%); justify-content: center; }
  .slide > * { position: relative; }

  .logo { position: absolute; left: 120px; bottom: 44px; height: 30px; opacity: .9; }
  .pg { position: absolute; right: 120px; bottom: 44px; font-size: 20px; color: var(--gray); font-weight: 500; }

  .kicker { font-size: 24px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); margin-bottom: 16px; }
  h1 { font-size: 120px; line-height: 1.02; font-weight: 800; letter-spacing: -.02em; }
  h2 { font-size: 62px; line-height: 1.1; font-weight: 700; letter-spacing: -.01em; margin-bottom: 40px; }
  .grad { background: linear-gradient(90deg, var(--blue-2), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { font-size: 34px; color: var(--muted); font-weight: 400; }
  .small { font-size: 20px; color: var(--muted); }
  .note { font-size: 22px; color: var(--muted); border-left: 4px solid var(--cyan); padding: 6px 0 6px 20px; }
  b, strong { font-weight: 700; color: #fff; }
  .c { color: var(--cyan); }

  .grid { display: grid; gap: 28px; }
  .g2 { grid-template-columns: repeat(2, 1fr); } .g3 { grid-template-columns: repeat(3, 1fr); } .g4 { grid-template-columns: repeat(4, 1fr); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 30px 34px; }
  .card.hl { background: linear-gradient(135deg, var(--blue) 0%, #0a3f9e 100%); border-color: transparent; }
  .num { font-size: 92px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
  .num.md { font-size: 66px; } .num.sm { font-size: 52px; }
  .lbl { font-size: 23px; color: var(--muted); margin-top: 12px; line-height: 1.35; }
  .card.hl .lbl { color: #dbe6ff; }
  .tag { display: inline-block; font-size: 18px; font-weight: 600; padding: 6px 14px; border-radius: 999px; background: rgba(34,194,244,.14); color: var(--cyan); margin-bottom: 14px; }
  .card.hl .tag { background: rgba(255,255,255,.16); color: #fff; }

  ul.list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
  ul.list li { font-size: 24px; line-height: 1.35; padding-left: 30px; position: relative; color: #e6e8f2; }
  ul.list li::before { content: ""; position: absolute; left: 0; top: 13px; width: 12px; height: 12px; border-radius: 3px; background: var(--cyan); }

  table.t { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 24px; }
  table.t th { text-align: left; font-weight: 600; color: var(--muted); font-size: 18px; text-transform: uppercase; letter-spacing: .08em; padding: 0 18px 12px; }
  table.t td { padding: 16px 18px; background: var(--card); line-height: 1.3; }
  table.t tr td:first-child { border-radius: 14px 0 0 14px; font-weight: 700; }
  table.t tr td:last-child { border-radius: 0 14px 14px 0; }
  table.t tr + tr td { border-top: 8px solid var(--bg); }
  table.t td.r, table.t th.r { text-align: right; }
  table.t tr.cur td { background: #1b2a4a; }

  .bar { height: 26px; border-radius: 13px; background: var(--card-2); overflow: hidden; display: flex; }
  .bar span { display: block; height: 100%; }

  /* calendário */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .cal .h { font-size: 18px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; padding-left: 6px; }
  .cal .d { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; height: 128px; overflow: hidden; }
  .cal .d .n { font-size: 24px; font-weight: 700; }
  .cal .d .e { font-size: 15.5px; color: var(--muted); line-height: 1.25; margin-top: 4px; }
  .cal .d .s { font-size: 18px; font-weight: 700; color: var(--cyan); margin-top: 4px; }
  .cal .d.out { opacity: .3; }
  .cal .d.cap { border-top: 5px solid var(--gray); }
  .cal .d.imr { border-top: 5px solid var(--blue-2); }
  .cal .d.ven { border-top: 5px solid var(--cyan); }
  .cal .d.key { background: var(--blue); border-color: var(--blue); }
  .cal .d.key .e { color: #dbe6ff; } .cal .d.key .s { color: #fff; }
  .legend { display: flex; gap: 30px; font-size: 19px; color: var(--muted); margin-top: 16px; }
  .legend i { display: inline-block; width: 26px; height: 6px; border-radius: 3px; margin-right: 10px; vertical-align: middle; }

  .person { display: grid; grid-template-columns: 170px 1fr auto; gap: 24px; align-items: center; background: var(--card); border-radius: 16px; padding: 14px 24px; }
  .person .who { font-size: 25px; font-weight: 700; }
  .person .what { font-size: 21px; color: #dfe2ee; line-height: 1.3; }
  .person .goal { font-size: 26px; font-weight: 800; color: var(--cyan); text-align: right; white-space: nowrap; }

  .check li::before { background: none !important; border: 3px solid #fff; width: 18px !important; height: 18px !important; top: 9px !important; border-radius: 5px !important; }
  .check li { padding-left: 38px !important; }

  #progress { position: fixed; left: 0; bottom: 0; height: 5px; background: linear-gradient(90deg, var(--blue), var(--cyan)); transition: width .25s ease; z-index: 5; }
  #hint { position: fixed; right: 16px; top: 12px; font: 500 13px Poppins, sans-serif; color: #6E7180; z-index: 5; opacity: .8; }
  @media print {
    html, body { overflow: visible; background: var(--bg); }
    #viewport { position: static; display: block; }
    #stage { transform: none !important; }
    .slide { display: flex !important; position: relative; width: 1920px; height: 1080px; page-break-after: always; break-after: page; }
    #progress, #hint { display: none; }
    @page { size: 1920px 1080px; margin: 0; }
  }

  /* ---- extras das aulas ---- */
  pre.code { background: #0c0c10; border: 1px solid var(--line); border-radius: 18px; padding: 26px 30px;
    font: 500 22px/1.45 "JetBrains Mono", ui-monospace, Menlo, monospace; color: #e6e8f2; white-space: pre; overflow: hidden; }
  pre.code .k { color: var(--cyan); } pre.code .c { color: var(--gray); } pre.code .s { color: #f6c344; }
  img.shot { width: 100%; border-radius: 18px; border: 1px solid var(--line); display: block; object-fit: cover; object-position: top; }
  .pill { display: inline-block; font-size: 20px; font-weight: 600; padding: 6px 16px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin: 0 8px 8px 0; }
  .pill.on { background: var(--blue); color: #fff; border-color: var(--blue); }
  .flow { display: flex; align-items: stretch; gap: 14px; }
  .flow .card { flex: 1; } .flow .arr { align-self: center; font-size: 40px; color: var(--cyan); }
  .bad { color: #ff6b6b; font-weight: 700; } .ok { color: #3ecf8e; font-weight: 700; } .warn { color: #f6c344; font-weight: 700; }
  .med { border-radius: 14px; padding: 12px 18px; font-weight: 700; font-size: 22px; margin-bottom: 10px; background: var(--card-2); }
  .med.b { color: #C98B4B; } .med.s { color: #9FB0AA; } .med.g { color: #E8C34A; }
  /* ---- diagramas Mermaid ---- */
  #stage.desenhando { transform: none !important; }
  #stage.desenhando .slide { display: flex !important; visibility: hidden; }
  pre.mermaid { background: transparent; display: flex; justify-content: center; align-items: center; flex: 1; min-height: 0; }
  pre.mermaid svg { width: 100% !important; height: 100% !important; max-width: none !important; }
  .diagrama { flex: 1; min-height: 0; display: flex; background: #101016; border: 1px solid var(--line); border-radius: 22px; padding: 22px; }
</style>
</head>
<body>
<div id="viewport"><div id="stage">

[[SLIDES]]
</div></div>
<div id="progress"></div>
<div id="hint">← → navegar · F tela cheia</div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
(function () {
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var stage = document.getElementById('stage');
  var progress = document.getElementById('progress');
  var i = 0;
  var fromHash = parseInt((location.hash || '').replace('#', ''), 10);
  if (fromHash >= 1 && fromHash <= slides.length) i = fromHash - 1;

  slides.forEach(function (s, k) {
    var pg = s.querySelector('.pg');
    if (pg) pg.textContent = (k + 1) + ' / ' + slides.length;
  });

  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + s + ')';
  }
  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach(function (s, k) { s.classList.toggle('active', k === i); });
    progress.style.width = ((i + 1) / slides.length * 100) + '%';
    history.replaceState(null, '', '#' + (i + 1));
  }
  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ' || k === 'Enter') { e.preventDefault(); show(i + 1); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); show(i - 1); }
    else if (k === 'Home') show(0);
    else if (k === 'End') show(slides.length - 1);
    else if (k === 'f' || k === 'F') {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      else document.exitFullscreen && document.exitFullscreen();
    }
  });
  document.getElementById('viewport').addEventListener('click', function (e) {
    if (e.clientX < window.innerWidth / 3) show(i - 1); else show(i + 1);
  });
  var tx = null;
  document.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 50) show(dx < 0 ? i + 1 : i - 1);
    tx = null;
  });
  window.addEventListener('hashchange', function () {
    var n = parseInt(location.hash.replace('#', ''), 10);
    if (n >= 1 && n <= slides.length && n - 1 !== i) show(n - 1);
  });
  window.addEventListener('resize', fit);
  fit();
  // Diagramas Mermaid: desenha com todos os slides "visíveis" (o Mermaid não mede elemento escondido)
  var diagramas = document.querySelectorAll('pre.mermaid');
  if (window.mermaid && diagramas.length) {
    stage.classList.add('desenhando');
    mermaid.initialize({ startOnLoad: false, theme: 'base', securityLevel: 'loose',
      flowchart: { curve: 'basis', htmlLabels: true, useMaxWidth: true, padding: 18, nodeSpacing: 40, rankSpacing: 60 },
      themeVariables: { fontFamily: 'Poppins, sans-serif', fontSize: '22px', background: '#101016',
        primaryColor: '#1E1E24', primaryTextColor: '#F5F6FC', primaryBorderColor: '#467CF6',
        lineColor: '#22C2F4', secondaryColor: '#25252d', tertiaryColor: '#14141A',
        clusterBkg: '#16161c', clusterBorder: '#2f2f39', edgeLabelBackground: '#14141A', titleColor: '#22C2F4' } });
    var fontes = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    fontes.then(function () { return mermaid.run({ nodes: diagramas }); })
      .catch(function (e) { console.error(e); })
      .finally(function () { stage.classList.remove('desenhando'); fit(); show(i); });
  } else { show(i); }
})();
</script>
</body>
</html>
